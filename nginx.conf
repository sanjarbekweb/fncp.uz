server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Backend Media Proxy
    location /media/ {
        proxy_pass https://api.fncp.uz;
        proxy_set_header Host api.fncp.uz;
        proxy_ssl_server_name on;
        proxy_buffering off;
    }

    # Backend API Proxy
    location ~* ^/(auth|me|users|landing-categories|referral|role|permission|event|dashboard|resources|camps|api)/ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html break;
        }
        proxy_pass https://api.fncp.uz;
        proxy_set_header Host api.fncp.uz;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Immutable hashed static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static files with direct lookup
    location ~* \.(ico|svg|png|jpg|jpeg|webp|gif|woff|woff2|ttf|eot|txt|xml)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # SPA Routing: Fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
